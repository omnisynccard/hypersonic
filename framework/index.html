<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="瀚軒 - 員工數位名片" />
  <meta name="theme-color" content="#1a3a5c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="瀚軒名片" />
  
  <title>瀚軒數位名片</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a3a5c' width='100' height='100'/><text x='50' y='65' font-size='60' fill='white' text-anchor='middle' font-weight='bold'>H</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231a3a5c' width='180' height='180'/><text x='90' y='130' font-size='100' fill='white' text-anchor='middle' font-weight='bold'>H</text></svg>" />
  
  <link rel="stylesheet" href="style.css" />
  
  <style>
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>
<body>
  <div class="bg-decoration">
    <div class="bg-circle bg-circle--1"></div>
    <div class="bg-circle bg-circle--2"></div>
  </div>

  <div class="card-wrapper">
    <div class="card">
      <!-- 頂部橫幅 -->
      <div class="card__header">
        <div class="card__header-left"></div>
        <div class="card__header-right"></div>
      </div>

      <!-- 個人資訊區 -->
      <div class="card__profile"></div>

      <!-- 分隔線 -->
      <hr class="card__divider-line" />

      <!-- 聯絡資訊區 -->
      <div class="card__contacts"></div>

      <!-- 名片圖片輪播區（可選） -->
      <div class="card__namecard-carousel" hidden>
        <h3 class="card__section-title">名片</h3>
        <div class="card__carousel-container">
          <button class="card__carousel-btn" id="prevSlide" title="上一張">◀</button>
          <div class="card__carousel-viewport">
            <div class="card__carousel-track" id="carouselTrack"></div>
          </div>
          <button class="card__carousel-btn" id="nextSlide" title="下一張">▶</button>
        </div>
        <div class="card__carousel-indicators" id="indicators"></div>
        <button class="card__carousel-download" id="downloadNamecard">📥 下載名片</button>
      </div>

      <!-- 社群媒體區 -->
      <div class="card__social">
        <h3 class="card__section-title">社群媒體</h3>
        <div class="card__social-grid"></div>
      </div>

      <!-- 操作按鈕區 -->
      <div class="card__actions"></div>

      <!-- QR Code 區 -->
      <div class="card__qrcode-section">
        <h3 class="card__section-title">掃描名片</h3>
        <div class="card__qrcode"></div>
      </div>

      <!-- 頁尾 -->
      <div class="card__footer"></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" hidden></div>

  <!-- Toast 通知 -->
  <div class="toast" hidden></div>

  <script src="main.js"></script>
</body>
</html>
